services:
  ai-usage-tracker:
    image: ai-usage-tracker:local
    build: .
    container_name: ai-usage-tracker
    restart: unless-stopped
    ports:
      # Localhost only; put a reverse proxy or Cloudflare Tunnel in front to expose it.
      - "127.0.0.1:8080:8080"
    environment:
      TRACKER_PASSWORD: ${TRACKER_PASSWORD:-}
      TRACKER_TRUST_PROXY: ${TRACKER_TRUST_PROXY:-false}
      TRACKER_PUBLIC_URL: ${TRACKER_PUBLIC_URL:-}
      TRACKER_POLL_INTERVAL: 10m
      # TRACKER_SECRET_KEY: optional passphrase for encrypting stored credentials;
      # if unset, a random key is generated in /data/secret.key
    volumes:
      - tracker-data:/data

volumes:
  tracker-data:
